name: Build Royal Ksamil Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare project generator
        run: |
          python -m pip install PyYAML==6.0.2
          python <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/build-apk.yml")
          workflow = yaml.safe_load(source.read_text())
          steps = workflow["jobs"]["build"]["steps"]
          script = next(
              step["run"] for step in steps
              if step.get("name") == "Create Android project"
          )
          Path("create-project.sh").write_text(script)
          PY

      - name: Create Android project
        run: bash -e create-project.sh

      - name: Update for Play Store
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path("build.gradle")
          text = root.read_text()
          assert "8.9.1" in text, "Unexpected plugin version"
          root.write_text(text.replace("8.9.1", "8.10.0"))

          app = Path("app/build.gradle")
          text = app.read_text()
          changes = {
              "compileSdk 35": "compileSdk 36",
              "targetSdk 35": "targetSdk 36",
              "versionCode 4": "versionCode 5",
              'versionName "4.0.0"': 'versionName "4.0.1"',
          }
          for old, new in changes.items():
              assert old in text, f"Missing setting: {old}"
              text = text.replace(old, new)
          app.write_text(text)

          activity = Path(
              "app/src/main/java/com/royalksamil/app/MainActivity.java"
          )
          text = activity.read_text()
          anchor = "setContentView(webView);"
          assert anchor in text
          text = text.replace(anchor, anchor + """
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      webView.setOnApplyWindowInsetsListener((view, insets) -> {
                          android.graphics.Insets bars = insets.getInsets(
                              android.view.WindowInsets.Type.systemBars()
                              | android.view.WindowInsets.Type.displayCutout()
                              | android.view.WindowInsets.Type.ime());
                          view.setPadding(
                              bars.left, bars.top, bars.right, bars.bottom);
                          return insets;
                      });
                      webView.requestApplyInsets();
                  }
          """, 1)
          activity.write_text(text)
          PY

      - name: Build App Bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Sign App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing signing secret: $key"
              exit 1
            fi
          done

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

          cp app/build/outputs/bundle/release/app-release.aab RoyalKsamil-PlayStore.aab

          jarsigner \
            -keystore signing.keystore \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            RoyalKsamil-PlayStore.aab "$KEY_ALIAS"

          jarsigner -verify RoyalKsamil-PlayStore.aab > verification.txt 2>&1
          cat verification.txt
          grep -q "jar verified" verification.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKsamil-PlayStore-AAB
          path: RoyalKsamil-PlayStore.aab
          if-no-files-found: error

      - name: Clean up signing file
        if: always()
        run: rm -f signing.keystore
