name: Build Royal Ksamil Final APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > signing.keystore

      - name: Build Royal Ksamil APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unzip -q RoyalKsamil-TWA-Final.zip -d twa
          cd twa/source

          chmod +x gradlew 2>/dev/null || true

          gradle --no-daemon assembleRelease

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$APK" RoyalKsamil-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks ../../signing.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out ../../RoyalKsamil-Final.apk \
            RoyalKsamil-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose ../../RoyalKsamil-Final.apk

      - name: Upload Royal Ksamil Final APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKsamil-Final-APK
          path: RoyalKsamil-Final.apk
