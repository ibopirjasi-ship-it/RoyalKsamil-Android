name: Build Royal Ksamil APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Royal Ksamil Android project
        run: |
          mkdir -p app/src/main/java/com/royalksamil/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/assets/www/upload
          mkdir -p app/src/main/assets/www/generated_images

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RoyalKsamil"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.royalksamil.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.royalksamil.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Royal Ksamil"
                  android:icon="@drawable/app_icon"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/royalksamil/app/MainActivity.java <<'EOF'
          package com.royalksamil.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setBackgroundColor(Color.rgb(2, 27, 44));
                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#00B9D6</item>
                  <item name="android:navigationBarColor">#021B2C</item>
                  <item name="android:statusBarColor">#021B2C</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#021B2C"
                  android:pathData="M0,0h108v108h-108z"/>

              <path
                  android:fillColor="#00B9D6"
                  android:pathData="M18,63 C34,46 48,72 66,54 C78,42 88,47 96,39 L96,75 C75,90 39,91 18,75 Z"/>

              <path
                  android:fillColor="#F6C453"
                  android:pathData="M54,19a12,12 0,1 0,0.1 0z"/>
          </vector>
          EOF

          cp index.html app/src/main/assets/www/index.html
          cp styles.css app/src/main/assets/www/styles.css
          cp app.js app/src/main/assets/www/app.js

          [ -f manifest.webmanifest ] && cp manifest.webmanifest app/src/main/assets/www/ || true
          [ -f sw.js ] && cp sw.js app/src/main/assets/www/ || true

          cp *.jpg app/src/main/assets/www/ 2>/dev/null || true
          cp *.jpg app/src/main/assets/www/upload/ 2>/dev/null || true
          cp *.jpg app/src/main/assets/www/generated_images/ 2>/dev/null || true

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoyalKsamil.apk

      - name: Upload Royal Ksamil APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKsamil-APK
          path: RoyalKsamil.apk
