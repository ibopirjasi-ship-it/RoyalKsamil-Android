name: Build Royal Ksamil APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Royal Ksamil project
        run: |
          unzip RoyalKsamil-Android-GitHub-APK.zip -d royal-build
          echo "PROJECT_DIR=$(find royal-build -type f -name settings.gradle -printf '%h\n' | head -n 1)" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" RoyalKsamil.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKsamil-APK
          path: RoyalKsamil.apk
