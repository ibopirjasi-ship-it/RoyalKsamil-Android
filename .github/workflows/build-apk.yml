name: Build Royal Ksamil V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/royalksamil/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RoyalKsamil"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.royalksamil.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.royalksamil.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName "3.0.0"
              }
          }
          EOF

          cp RoyalKsamil-App-Icon.png \
             app/src/main/res/drawable/royal_ksamil_icon.png

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Royal Ksamil"
                  android:icon="@drawable/royal_ksamil_icon"
                  android:roundIcon="@drawable/royal_ksamil_icon"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#021B2C</item>
                  <item name="android:navigationBarColor">#021B2C</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowBackground">#021B2C</item>
                  <item name="android:colorAccent">#00B9D6</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/royalksamil/app/MainActivity.java <<'EOF'
          package com.royalksamil.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                      android.graphics.Color.rgb(2, 27, 44)
                  );

                  getWindow().setNavigationBarColor(
                      android.graphics.Color.rgb(2, 27, 44)
                  );

                  webView = new WebView(this);

                  webView.setBackgroundColor(
                      android.graphics.Color.rgb(2, 27, 44)
                  );

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  );

                  settings.setUserAgentString(
                      settings.getUserAgentString()
                      + " RoyalKsamilAndroid/3.0"
                  );

                  CookieManager cookies =
                      CookieManager.getInstance();

                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(
                      webView,
                      true
                  );

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              Uri uri = request.getUrl();

                              if (uri == null) {
                                  return false;
                              }

                              String scheme = uri.getScheme();

                              if ("http".equalsIgnoreCase(scheme)
                                  || "https".equalsIgnoreCase(scheme)) {

                                  return false;
                              }

                              try {

                                  Intent intent =
                                      new Intent(
                                          Intent.ACTION_VIEW,
                                          uri
                                      );

                                  startActivity(intent);

                                  return true;

                              } catch (Exception e) {

                                  return false;
                              }
                          }
                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                          ) {

                              if (fileCallback != null) {
                                  fileCallback.onReceiveValue(null);
                              }

                              fileCallback = callback;

                              Intent intent;

                              try {

                                  intent =
                                      params.createIntent();

                              } catch (Exception e) {

                                  intent =
                                      new Intent(
                                          Intent.ACTION_GET_CONTENT
                                      );

                                  intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType("*/*");
                              }

                              try {

                                  startActivityForResult(
                                      intent,
                                      FILE_REQUEST
                                  );

                                  return true;

                              } catch (Exception e) {

                                  fileCallback = null;
                                  return false;
                              }
                          }

                          @Override
                          public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback
                          ) {

                              callback.invoke(
                                  origin,
                                  true,
                                  false
                              );
                          }

                          @Override
                          public void onPermissionRequest(
                              PermissionRequest request
                          ) {

                              runOnUiThread(
                                  () -> request.grant(
                                      request.getResources()
                                  )
                              );
                          }
                      }
                  );

                  webView.setDownloadListener(
                      (
                          url,
                          userAgent,
                          contentDisposition,
                          mimeType,
                          contentLength
                      ) -> {

                          try {

                              Intent intent =
                                  new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(url)
                                  );

                              startActivity(intent);

                          } catch (Exception ignored) {
                          }
                      }
                  );

                  webView.loadUrl(
                      "https://royal-ksamil.ibotiran.chatgpt.site/"
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode != FILE_REQUEST) {
                      return;
                  }

                  if (fileCallback == null) {
                      return;
                  }

                  Uri[] result = null;

                  if (
                      resultCode == RESULT_OK
                      && data != null
                  ) {

                      if (data.getClipData() != null) {

                          int count =
                              data.getClipData()
                                  .getItemCount();

                          result =
                              new Uri[count];

                          for (
                              int i = 0;
                              i < count;
                              i++
                          ) {

                              result[i] =
                                  data.getClipData()
                                      .getItemAt(i)
                                      .getUri();
                          }

                      } else if (
                          data.getData() != null
                      ) {

                          result =
                              new Uri[]{
                                  data.getData()
                              };
                      }
                  }

                  fileCallback.onReceiveValue(result);
                  fileCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null
                      && webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {

                  super.onPause();

                  if (webView != null) {
                      webView.onPause();
                  }

                  CookieManager
                      .getInstance()
                      .flush();
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (webView != null) {
                      webView.onResume();
                  }
              }
          }
          EOF

      - name: Build Royal Ksamil V3 APK
        run: gradle --no-daemon assembleDebug

      - name: Create final APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             RoyalKsamil-v3.apk

      - name: Upload Royal Ksamil V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKsamil-v3-APK
          path: RoyalKsamil-v3.apk
          if-no-files-found: error
